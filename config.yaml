listen_addr: ":8080"

# ---------------------------------------------------------------------------
# Model tiers with routing rules
#
# Evaluation order: priority (lowest first). Within a tier:
#   1. task_types match → select tier
#   2. code_signals detected in text → select tier (if score < 0.60)
#   3. any routing rule matches → select tier
#   4. fallback: true → catch-all for unmatched requests
#
# Rule logic:
#   - Multiple rules per tier: OR (any match selects the tier)
#   - Fields within a rule: AND (all must be satisfied)
#   - Omitted fields: ignored (no constraint)
# ---------------------------------------------------------------------------

Models:
  - name: small
    priority: 1
    routing:
      # Simple QA / classification with low complexity and low reasoning
      rules:
        - task_types: ["QA", "Classification"]
          max_score: 0.15
          max_reasoning: 0.15
    models:
      - id: replica-small-1
        url: http://localhost:8001
        model: Qwen/Qwen2.5-1.5B-Instruct-AWQ
      - id: replica-small-2
        url: http://localhost:8002
        model: Qwen/Qwen2.5-1.5B-Instruct-AWQ

  - name: code
    priority: 2
    routing:
      # Explicit code tasks route here directly
      task_types: ["Code Generation"]
      # Also catches code blocks in non-code tasks (```, def, class, function)
      # but only if overall complexity is below 0.60
      code_signals: true
    models:
      - id: replica-code-1
        url: http://localhost:8003
        model: Qwen/Qwen2.5-Coder-7B-Instruct-AWQ

  - name: medium
    priority: 3
    routing:
      # Catch-all: anything not simple enough for small, not complex enough
      # for large, and not a code task
      fallback: true
    models:
      - id: replica-medium-1
        url: http://localhost:8004
        model: Qwen/Qwen2.5-14B-Instruct-AWQ

  - name: large
    priority: 4
    routing:
      # High reasoning + moderate complexity
      # OR high complexity + high domain knowledge + moderate constraints
      rules:
        - min_reasoning: 0.70
          min_score: 0.55
        - min_score: 0.65
          min_domain: 0.80
          min_constraint: 0.60
    models:
      - id: replica-large-1
        url: http://localhost:8005
        model: Qwen/Qwen2.5-72B-Instruct-AWQ

  - name: reasoning
    priority: 5
    routing:
      # Very high reasoning with high complexity — chain-of-thought tasks
      rules:
        - min_reasoning: 0.85
          min_score: 0.75
    models:
      - id: replica-reasoning-1
        url: http://localhost:8006
        model: Qwen/QwQ-32B-AWQ

# ---------------------------------------------------------------------------
# Hybrid routing: vLLM replicas and external LLM APIs in the same tiers
#
# A replica is a local vLLM server by default (provider: vllm, needs `url`).
# Set `provider: anthropic` to route a tier (or part of one) to Claude instead.
# API replicas need no `url` — it is resolved from ANTHROPIC_BASE_URL (falling
# back to https://api.anthropic.com) — and read their credential from the env
# var named by `api_key_env` (default ANTHROPIC_API_KEY). Secrets stay out of
# YAML. API replicas are not health-polled; the circuit breaker guards them.
#
# Mix providers within a tier for hybrid, use only vLLM replicas for a pure
# local deployment, or use only API replicas for a pure-API deployment:
#
#   - name: large
#     priority: 4
#     routing:
#       rules: [{ min_reasoning: 0.70, min_score: 0.55 }]
#     models:
#       - id: replica-large-1            # local vLLM
#         url: http://localhost:8005
#         model: Qwen/Qwen2.5-72B-Instruct-AWQ
#       - id: claude-sonnet              # external API, same tier
#         provider: anthropic
#         model: claude-sonnet-4-6
#         api_key_env: ANTHROPIC_API_KEY
# ---------------------------------------------------------------------------

redis:
  addr: localhost:6379

weights:
  cache_affinity: 0.50
  queue_depth: 0.25
  kv_cache_pressure: 0.15
  baseline: 0.10
  # Subtracted on a prefix-cache miss. Raises the cost of routing a
  # request to a replica that would have to recompute the prefix.
  miss_penalty: 0.25

classifier:
  length: 0.20
  code: 0.30
  reasoning: 0.15
  complexity: 0.10
  conv_depth: 0.10
  output_length: 0.15

circuit:
  error_threshold: 0.5
  window_size: 10s
  cooldown: 30s
  min_samples: 5

retry:
  max_retries: 1
  timeout: 30s

stream:
  stall_timeout: 15s
  done_timeout: 0s

auth:
  enabled: false
  keys: []

ratelimit:
  enabled: false
  requests_per_minute: 60
  burst: 10

audit:
  enabled: true
  buffer_size: 1000

usage:
  enabled: true
  postgres:
    enabled: false
    dsn: postgres://router:router@localhost:5432/router?sslmode=disable
    flush_interval: 5s
    batch_size: 100
    buffer_size: 4096

prefix_len: 512
affinity_ttl: 5m
threshold: 0.35
max_queue: 20
poll_interval: 2s

classifier_settings:
  maxTokensForNormalization: 120
  codeKeywordThreshold: 3
  reasoningKeywordThreshold: 2
  complexityKeywordThreshold: 2
  maxConversationDepth: 5
  maxTokensForOutputEstimate: 200

keywords:
  strong_reasoning: ["explain", "reason", "think", "why", "how", "what if", "analyze", "compare", "contrast", "evaluate", "justify", "prove", "disprove"]
  code: ["code", "program", "script", "function", "class", "def", "import"]
  complexity: ["step by step", "edge case", "production", "distributed", "scale", "optimize"]
  reasoning: ["explain", "reason", "think", "why", "how", "what if", "analyze", "compare", "contrast", "evaluate", "justify", "prove", "disprove"]

repetition:
  frequency_penalty: 0.2
  presence_penalty: 0.1